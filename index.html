<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotoMonitor - Catálogo de Precios</title>
    <link rel="stylesheet" href="static/css/style.css">
    <!-- SheetJS para exportar a Excel en el cliente -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>

<body>
    <header class="main-header">
        <h1>MotoMonitor</h1>
        <p class="subtitle">Comparador y catálogo en tiempo real de motos Bera, Empire, TVS y Toro</p>
    </header>

    <div class="control-panel">
        <!-- Barra de filtros -->
        <div class="filter-bar">
            <div class="filter-group search-box">
                <label for="searchName">Buscar Moto</label>
                <input type="text" id="searchName" placeholder="Ej: SBR, Xpress, V302C...">
            </div>
            
            <div class="filter-group">
                <label for="filterBrand">Marca</label>
                <select id="filterBrand">
                    <option value="Todos">Todas las Marcas</option>
                    <option value="Bera">Bera</option>
                    <option value="Empire">Empire Keeway</option>
                    <option value="TVS">TVS Motor</option>
                    <option value="Toro">Toro Motorcycles</option>
                </select>
            </div>
            
            <div class="filter-group">
                <label for="filterCategory">Categoría</label>
                <select id="filterCategory">
                    <option value="Todas">Todas las Categorías</option>
                    <option value="Automáticas">Automáticas</option>
                    <option value="Sincrónicas">Sincrónicas</option>
                    <option value="Carga">Carga</option>
                    <option value="Eléctricas">Eléctricas</option>
                    <option value="Otros">Otros</option>
                </select>
            </div>
            
            <div class="filter-group price-inputs">
                <label>Precio (USD)</label>
                <div class="price-range">
                    <input type="number" id="filterMinPrice" placeholder="Mín" min="0">
                    <span>-</span>
                    <input type="number" id="filterMaxPrice" placeholder="Máx" min="0">
                </div>
            </div>

            <div class="action-buttons">
                <button id="btnExportExcel" class="btn-excel">
                    <svg class="btn-icon" viewBox="0 0 24 24">
                        <path fill="currentColor" d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
                    </svg>
                    Exportar a Excel
                </button>
                <button id="btnActualizarDb" class="btn-sync" onclick="actualizarBaseDeDatos()">
                    <svg class="btn-icon" viewBox="0 0 24 24">
                        <path fill="currentColor" d="M19 8l-4 4h3c0 3.31-2.69 6-6 6-1.01 0-1.97-.25-2.8-.7l-1.46 1.46C8.97 19.54 10.43 20 12 20c4.42 0 8-3.58 8-8h3l-4-4zM6 12c0-3.31 2.69-6 6-6 1.01 0 1.97.25 2.8.7l1.46-1.46C15.03 4.46 13.57 4 12 4c-4.42 0-8 3.58-8 8H1l4 4 4-4H6z"/>
                    </svg>
                    Sincronizar BD
                </button>
            </div>
        </div>
        
        <!-- Indicador de Tasa y estadísticas rápidas -->
        <div class="meta-info">
            <span id="rateIndicator" class="badge">Tasa: Cargando...</span>
            <span id="totalIndicator" class="badge">Cargando motos...</span>
        </div>
    </div>

    <main id="catalogContainer">
        <div class="loader-container">
            <div class="spinner"></div>
            <p>Cargando catálogo unificado...</p>
        </div>
    </main>

    <!-- Modal de Detalle de Especificaciones -->
    <div id="motoModal" class="modal">
        <div class="modal-overlay" onclick="cerrarModal()"></div>
        <div class="modal-content">
            <button class="modal-close" onclick="cerrarModal()" aria-label="Cerrar modal">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                </svg>
            </button>
            <div class="modal-body">
                <div class="modal-left">
                    <span id="modalBrandBadge" class="brand-badge"></span>
                    <div class="modal-image-container">
                        <img id="modalImage" src="" alt="Imagen de la moto">
                    </div>
                    <div class="modal-quick-info">
                        <h2 id="modalTitle"></h2>
                        <div class="modal-price-container">
                            <span id="modalPriceUsd" class="modal-price-tag"></span>
                            <span id="modalPriceVes" class="modal-price-ves"></span>
                        </div>
                        <a id="modalLink" href="" target="_blank" class="modal-link-btn">Ver Sitio Oficial</a>
                    </div>
                </div>
                <div class="modal-right">
                    <h3>Especificaciones Técnicas</h3>
                    <div class="specs-wrapper">
                        <div id="modalSpecsGrid" class="specs-grid">
                            <!-- Se poblará dinámicamente con JS -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 1. Configuración primero -->
    <script src="static/js/config.js"></script>

    <!-- 2. Renderizador después -->
    <script src="static/js/ui_renderer.js"></script>

    <!-- 3. Los motores de datos al final (compatibilidad) -->
    <script src="static/js/motosbera.js"></script>
    <script src="static/js/motosempire.js"></script>
    <script>fetchTasaCambio();</script>
</body>

</html>
